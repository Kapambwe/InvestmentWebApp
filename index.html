<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Investment Web App</title>

    <!-- Base path: '/' for local dev; deploy script patches to '/InvestmentWebApp/' for GitHub Pages -->
    <base href="/InvestmentWebApp/" />

    <!-- Single Page App routing for GitHub Pages -->

    <!-- Defer non-critical CSS to avoid blocking first paint -->
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="css/app.css" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="_content/Radzen.Blazor/css/material-base.css" media="print" onload="this.media='all'">
    <noscript>
        <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="css/app.css">
        <link rel="stylesheet" href="_content/Radzen.Blazor/css/material-base.css">
    </noscript>

    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="InvestmentWebApp.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text">Loading...</div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">ðŸ—™</span>
    </div>

    <!-- Load Blazor and Radzen scripts dynamically to respect the base path -->
    <script>
        (function () {
            var baseElement = document.querySelector('base');
            var basePath = baseElement ? baseElement.getAttribute('href') : '/';

            if (basePath === '/') {
                basePath = '';
            } else if (basePath.endsWith('/')) {
                basePath = basePath.slice(0, -1);
            }

            var blazorScript = document.createElement('script');
            blazorScript.src = basePath + '/_framework/blazor.webassembly.js';
            blazorScript.defer = true;
            document.body.appendChild(blazorScript);

            var radzenScript = document.createElement('script');
            radzenScript.src = basePath + '/_content/Radzen.Blazor/Radzen.Blazor.js';
            radzenScript.defer = true;
            document.body.appendChild(radzenScript);
        })();
    </script>

    <script>
        // Restore path if redirected from 404.html (GitHub Pages SPA routing)
        (function () {
            const params = new URLSearchParams(window.location.search);
            const path = params.get('path');
            if (path) {
                var basePath = window.location.pathname.includes('/InvestmentWebApp') ? '/InvestmentWebApp' : '';
                window.history.replaceState(null, '', basePath + decodeURIComponent(path));
            }
        })();
    </script>
</body>

</html>
